<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <!-- The guide serves everything itself. This stops the page loading or running anything
       from anywhere else, whatever ends up in content.md. 'unsafe-inline' covers the style
       attribute on map tiles only: no inline script is allowed. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MUSA Muslim Guide</title>
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#0F2A24">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <button class="back-button" id="back" type="button" hidden><span class="back-face"><svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</span></button>
      <h1 class="appbar-title" id="screen-title" tabindex="-1">MUSA Muslim Guide</h1>
    </div>
  </header>

  <main class="wrap" id="app">
    <p class="loading">Loading the guide…</p>
    <noscript><p class="load-error">This guide needs JavaScript turned on to show its listings.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="site-footer"></div>
  </footer>
</body>
</html>
