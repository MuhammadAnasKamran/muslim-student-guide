<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MUSA Muslim Guide</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#guide">Skip to the guide</a>

  <header class="site-header">
    <div class="wrap">
      <p class="site-org" id="site-org"></p>
      <h1 class="site-title" id="site-title">MUSA Muslim Guide</h1>
      <p class="site-subtitle" id="site-subtitle"></p>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="wrap">
      <form class="search" id="search-form" role="search">
        <label class="search-label" for="search">Search the guide</label>
        <div class="search-row">
          <input class="search-input" id="search" name="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" placeholder="Room, food, shop or area" aria-describedby="result-count">
          <button class="clear-button" id="clear-search" type="button" hidden>Clear<span class="visually-hidden"> search</span></button>
        </div>
      </form>
      <div class="chips" id="filters" role="group" aria-label="Filter listings"></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>
  </div>

  <main class="wrap" id="guide" tabindex="-1">
    <p class="loading">Loading the guide…</p>
    <noscript><p class="load-error">This guide needs JavaScript turned on to show its listings.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="site-footer"></div>
  </footer>
</body>
</html>
